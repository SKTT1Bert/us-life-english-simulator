name: Learning app checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scheduling, personal data and translator unit tests
        run: node --test tests/*.test.js
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Existing learning flows
        run: node tests/browser.cjs
      - name: Personal expressions and import safety
        run: node tests/personal-browser.cjs
      - name: Contemporary expressions and stable daily plans
        run: node tests/trending-browser.cjs
      - name: Foundation courses and visual accessibility
        run: node tests/foundations-browser.cjs
      - name: Zero to C1 learning pathway
        run: node tests/pathway-browser.cjs
      - name: Foundation stage outputs, reviews and assessments
        run: node tests/foundation-study-browser.cjs
      - name: Daily plans, diagnostic routing, sentence listening and learning reports
        run: node tests/learning-studio-browser.cjs
      - name: Real human audio, local grammar and speech engines
        run: node tests/skill-runtime-browser.cjs
      - name: Speaking, writing, revisions and alternate assessments
        run: node tests/skill-workshop-browser.cjs
      - name: Multiple AI voices, original audio and preserved progress
        run: node tests/ai-audio-browser.cjs
      - name: Unified course voices with real local synthesis
        run: node tests/unified-speech-browser.cjs
      - name: One writer per browser and safe tab handover
        run: node tests/sync-gate-browser.cjs
      - name: Encrypted pairing, offline merge and preservation
        run: node tests/sync-browser.cjs
      - name: Illustrated scenes and shared role play
        run: node tests/scenes-browser.cjs
