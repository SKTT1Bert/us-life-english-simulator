name: Learning app checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scheduling, personal data and translator unit tests
        run: node --test tests/review.test.js tests/translator.test.js tests/custom-expressions.test.js tests/trending-content.test.js tests/foundations.test.js tests/pathway-progress.test.js tests/pathway-content.test.js tests/foundation-progress-v2.test.js tests/foundation-curriculum.test.js tests/scene-lessons.test.js
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Existing learning flows
        run: node tests/browser.cjs
      - name: Personal expressions and import safety
        run: node tests/personal-browser.cjs
      - name: Contemporary expressions and stable daily plans
        run: node tests/trending-browser.cjs
      - name: Foundation courses and visual accessibility
        run: node tests/foundations-browser.cjs
      - name: Zero to C1 learning pathway
        run: node tests/pathway-browser.cjs
      - name: Foundation stage outputs, reviews and assessments
        run: node tests/foundation-study-browser.cjs
      - name: Illustrated scenes and shared role play
        run: node tests/scenes-browser.cjs
